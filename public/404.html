<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aviix Media</title>
    <script>
      // SPA GitHub Pages redirect hack.
      // When GitHub Pages serves this 404.html, we redirect back to the app root
      // and pass the original path as a query param so the app can restore it.
      var pathSegmentsToKeep = 0; // set to 1 if using a project page repo with a /repo-name/ base
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
